name: N24 Operator APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase configuration
        env:
          FIREBASE_CONFIG: ${{ secrets.N24_FIREBASE_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s' "$FIREBASE_CONFIG" | base64 --decode > app/google-services.json
            echo "Firebase configuration restored; push may work when the server is also configured."
          else
            echo "::warning::Building a chat-only APK without Firebase push. Add N24_FIREBASE_JSON_BASE64 later."
          fi
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: N24-Operator-V22-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

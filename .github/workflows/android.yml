name: N24 Native Operator APK V27
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted runners already include the Android SDK.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Firebase config when available
        shell: bash
        env:
          N24_FIREBASE_JSON_BASE64: ${{ secrets.N24_FIREBASE_JSON_BASE64 }}
        run: |
          if [ -n "$N24_FIREBASE_JSON_BASE64" ]; then
            printf '%s' "$N24_FIREBASE_JSON_BASE64" | base64 --decode > app/google-services.json
            echo 'FCM client configuration enabled'
          else
            echo '::warning::Firebase file not configured, native chat works but push notifications are disabled'
          fi
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N24-Native-Operator-V27-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
